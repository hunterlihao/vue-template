name: CI

on:
  push:
    branches: [main]
  pull_request:

# 只需要读权限:公开仓库按最小权限原则配置
permissions:
  contents: read

# 同一分支连续推送时取消上一次未跑完的任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 版本从 package.json 的 packageManager 字段读取
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # 与 .nvmrc 保持单一来源,避免 CI 版本和本地开发版本不一致
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm type-check

      - name: ESLint
        run: pnpm lint

      - name: Stylelint
        run: pnpm lint:style

      - name: 单元测试
        run: pnpm test

      - name: 构建
        run: pnpm build
