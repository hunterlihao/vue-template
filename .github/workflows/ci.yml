name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本从 package.json 的 packageManager 字段读取
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm type-check

      - name: ESLint
        run: pnpm lint

      - name: Stylelint
        run: pnpm lint:style

      - name: 单元测试
        run: pnpm test

      - name: 构建
        run: pnpm build
